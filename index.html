<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ball Runner - Smooth Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #ffffff;
            color: #222222;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Disables pinch zoom and unwanted scroll lag */
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #111;
        }
        #score-board {
            font-size: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }
        canvas {
            border: 2px solid #222;
            background-color: #f9f9f9;
            width: 90vw;
            max-width: 420px;
            height: auto;
            display: block;
            border-radius: 4px;
        }
        .instructions {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>BALL RUNNER</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="500" height="200"></canvas>
    
    <div class="instructions"><strong>Tap screen</strong> or press <strong>Spacebar</strong> to Jump</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d", { alpha: false }); // Optimizes canvas rendering performance

        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;

        const groundY = 160;

        const ball = {
            x: 50,
            y: groundY - 14,
            radius: 14,
            dy: 0,
            jumpStrength: -9.5,
            gravity: 0.5,
            grounded: true
        };

        let obstacles = [];
        let obstacleTimer = 0;
        let nextObstacleTime = 110;

        function triggerJump(e) {
            if (e) e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (ball.grounded) {
                ball.dy = ball.jumpStrength;
                ball.grounded = false;
            }
        }

        // Instant response listeners using pointer events for mobile & desktop unity
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                triggerJump(e);
            }
        });

        canvas.addEventListener("pointerdown", function(e) {
            triggerJump(e);
        }, { passive: false });

        function update() {
            if (isGameOver) return;

            // Clear frame
            ctx.fillStyle = "#f9f9f9";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground line
            ctx.strokeStyle = "#222222";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Physics
            ball.dy += ball.gravity;
            ball.y += ball.dy;

            if (ball.y > groundY - ball.radius) {
                ball.y = groundY - ball.radius;
                ball.dy = 0;
                ball.grounded = true;
            }

            // Draw Ball
            ctx.fillStyle = "#222222";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Obstacles handler
            obstacleTimer++;
            if (obstacleTimer >= nextObstacleTime) {
                spawnObstacle();
                obstacleTimer = 0;
                nextObstacleTime = Math.floor(Math.random() * 40) + 90;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Hitbox collision check
                if (
                    ball.x + ball.radius > obs.x &&
                    ball.x - ball.radius < obs.x + obs.width &&
                    ball.y + ball.radius > obs.y
                ) {
                    isGameOver = true;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById("score").innerText = score;
                    if (score % 50 === 0) gameSpeed += 0.3;
                }
            }

            // Game Over Screen
            if (isGameOver) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#222222";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 8);

                ctx.font = "13px Arial";
                ctx.fillStyle = "#666666";
                ctx.fillText("Tap to Restart", canvas.width / 2, canvas.height / 2 + 16);
                ctx.textAlign = "left";
            }

            requestAnimationFrame(update);
        }

        function spawnObstacle() {
            const height = Math.floor(Math.random() * 18) + 18;
            const width = 14;
            obstacles.push({
                x: canvas.width,
                y: groundY - height,
                width: width,
                height: height
            });
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            obstacleTimer = 0;
            nextObstacleTime = 110;
            document.getElementById("score").innerText = score;
            ball.y = groundY - ball.radius;
            ball.dy = 0;
            ball.grounded = true;
            isGameOver = false;
            update();
        }

        update();
    </script>
</body>
</html>
