<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>White Ball Runner</title>
    <style>
        body {
            background-color: #ffffff;
            color: #222222;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 {
            margin: 5px 0;
            font-size: 20px;
            color: #111;
            text-align: center;
        }
        #score-board {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        canvas {
            border: 3px solid #222;
            background-color: #f7f7f7;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 92vw;
            max-width: 500px;
            height: auto;
            display: block;
            border-radius: 6px;
        }
        .instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h1>BALL RUNNER</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="600" height="250"></canvas>
    
    <div class="instructions"><strong>Tap screen</strong> or press <strong>Spacebar</strong> to Jump</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;

        const groundY = 200;

        const ball = {
            x: 60,
            y: groundY - 15,
            radius: 15,
            dy: 0,
            jumpStrength: -10,
            gravity: 0.55,
            grounded: true
        };

        let obstacles = [];
        let obstacleTimer = 0;
        let nextObstacleTime = 130;

        function triggerJump() {
            if (isGameOver) {
                resetGame();
            } else if (ball.grounded) {
                ball.dy = ball.jumpStrength;
                ball.grounded = false;
            }
        }

        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                triggerJump();
                e.preventDefault();
            }
        });

        canvas.addEventListener("touchstart", function(e) {
            triggerJump();
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener("click", function(e) {
            triggerJump();
        });

        function update() {
            if (isGameOver) return;

            // Clear canvas with light background
            ctx.fillStyle = "#f7f7f7";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ground line
            ctx.strokeStyle = "#333333";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Ball physics
            ball.dy += ball.gravity;
            ball.y += ball.dy;

            if (ball.y > groundY - ball.radius) {
                ball.y = groundY - ball.radius;
                ball.dy = 0;
                ball.grounded = true;
            }

            // Draw Ball (Dark grey/black design)
            ctx.fillStyle = "#222222";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Inner highlight dot on ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x - 3, ball.y - 3, 3, 0, Math.PI * 2);
            ctx.fill();

            // Obstacles
            obstacleTimer++;
            if (obstacleTimer >= nextObstacleTime) {
                spawnObstacle();
                obstacleTimer = 0;
                nextObstacleTime = Math.floor(Math.random() * 50) + 100;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                ctx.fillStyle = "#e74c3c"; // Reddish obstacles for contrast
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Collision detection
                if (
                    ball.x + ball.radius > obs.x &&
                    ball.x - ball.radius < obs.x + obs.width &&
                    ball.y + ball.radius > obs.y
                ) {
                    isGameOver = true;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById("score").innerText = score;
                    if (score % 50 === 0) gameSpeed += 0.4;
                }
            }

            // Game Over overlay
            if (isGameOver) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#222222";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

                ctx.font = "14px Arial";
                ctx.fillStyle = "#666666";
                ctx.fillText("Tap Anywhere to Restart", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }

            requestAnimationFrame(update);
        }

        function spawnObstacle() {
            const height = Math.floor(Math.random() * 20) + 22;
            const width = 16;
            obstacles.push({
                x: canvas.width,
                y: groundY - height,
                width: width,
                height: height
            });
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            obstacleTimer = 0;
            nextObstacleTime = 130;
            document.getElementById("score").innerText = score;
            ball.y = groundY - ball.radius;
            ball.dy = 0;
            ball.grounded = true;
            isGameOver = false;
            update();
        }

        update();
    </script>
</body>
</html>
