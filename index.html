<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Green Ball Runner</title>
    <style>
        body {
            background-color: #0d1b1e;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Prevents phone screen bouncing/scrolling */
            touch-action: none; 
        }
        h1 {
            margin-bottom: 5px;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
            text-align: center;
        }
        #score-board {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            border: 3px solid #00ff66;
            background-color: #112a22;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            max-width: 100%;
            height: auto;
        }
        .instructions {
            margin-top: 10px;
            font-size: 12px;
            color: #79ac8e;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h1>GREEN BALL RUNNER</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="800" height="300"></canvas>
    
    <div class="instructions"><strong>Tap screen</strong> or press <strong>Spacebar</strong> to Jump</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game variables
        let score = 0;
        let gameSpeed = 6;
        let isGameOver = false;

        // Player (The Ball)
        const ball = {
            x: 80,
            y: 220,
            radius: 18,
            dy: 0,
            jumpStrength: -11,
            gravity: 0.6,
            grounded: true
        };

        // Obstacles array
        let obstacles = [];
        let obstacleTimer = 0;
        let nextObstacleTime = 100;

        // Jump action handler (used for both keyboard and mobile tap)
        function triggerJump() {
            if (isGameOver) {
                resetGame();
            } else if (ball.grounded) {
                ball.dy = ball.jumpStrength;
                ball.grounded = false;
            }
        }

        // Listen for keyboard controls (Desktop)
        document.addEventListener("keydown", function(e) {
            if ((e.code === "Space" || e.code === "ArrowUp")) {
                triggerJump();
                e.preventDefault(); // Prevent page scrolling on spacebar
            }
        });

        // Listen for touch/click controls (Mobile & Tablet)
        window.addEventListener("touchstart", function(e) {
            triggerJump();
            e.preventDefault();
        }, { passive: false });

        window.addEventListener("click", function(e) {
            // Avoid double triggering if it was a touch event on some browsers
            if (e.pointerType === "touch") return;
        });

        // Main Game Loop
        function update() {
            if (isGameOver) return;

            // Clear canvas
            ctx.fillStyle = "#112a22";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw green ground line
            ctx.strokeStyle = "#00ff66";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 240);
            ctx.lineTo(canvas.width, 240);
            ctx.stroke();

            // Ball physics (gravity & jumping)
            ball.dy += ball.gravity;
            ball.y += ball.dy;

            // Ground collision
            if (ball.y > 240 - ball.radius) {
                ball.y = 240 - ball.radius;
                ball.dy = 0;
                ball.grounded = true;
            }

            // Draw the Ball
            ctx.fillStyle = "#00ff66";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            // Glowing core
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x - 4, ball.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();

            // Handle obstacle spawning
            obstacleTimer++;
            if (obstacleTimer >= nextObstacleTime) {
                spawnObstacle();
                obstacleTimer = 0;
                nextObstacleTime = Math.floor(Math.random() * 50) + 70;
            }

            // Move and draw obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Draw obstacle
                ctx.fillStyle = "#33cc66";
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Collision detection
                if (
                    ball.x + ball.radius > obs.x &&
                    ball.x - ball.radius < obs.x + obs.width &&
                    ball.y + ball.radius > obs.y
                ) {
                    isGameOver = true;
                }

                // Remove off-screen obstacles and increase score
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById("score").innerText = score;

                    if (score % 50 === 0) {
                        gameSpeed += 0.5;
                    }
                }
            }

            // Draw Game Over Screen
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00ff66";
                ctx.font = "bold 26px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "14px 'Courier New'";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("Tap or Press Space to Restart", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left"; 
            }

            requestAnimationFrame(update);
        }

        function spawnObstacle() {
            const height = Math.floor(Math.random() * 25) + 25;
            const width = 20;
            obstacles.push({
                x: canvas.width,
                y: 240 - height,
                width: width,
                height: height
            });
        }

        function resetGame() {
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            obstacleTimer = 0;
            nextObstacleTime = 100;
            document.getElementById("score").innerText = score;
            ball.y = 220;
            ball.dy = 0;
            ball.grounded = true;
            isGameOver = false;
            update();
        }

        // Start game loop
        update();
    </script>
</body>
</html>
