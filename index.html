<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 15px;
        }
        canvas {
            border: 4px solid #333;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>SNAKE GAME</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="instructions">Use Arrow Keys to Move</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let changingDirection = false; // Prevents fast double-click self-collision bugs

        // Listen for keyboard directions
        document.addEventListener("keydown", changeDirection);

        function main() {
            if (hasGameEnded()) {
                alert("Game Over! Final Score: " + score);
                resetGame();
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // Run the game loop every 100 milliseconds
        setInterval(main, 100);
        generateFood();

        function clearCanvas() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00ff66" : "#00aa44";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Make sure food doesn't spawn directly on top of the snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            if (changingDirection) return;

            if (keyPressed === LEFT && dx === 0) {
                dx = -1; dy = 0;
                changingDirection = true;
            }
            if (keyPressed === UP && dy === 0) {
                dx = 0; dy = -1;
                changingDirection = true;
            }
            if (keyPressed === RIGHT && dx === 0) {
                dx = 1; dy = 0;
                changingDirection = true;
            }
            if (keyPressed === DOWN && dy === 0) {
                dx = 0; dy = 1;
                changingDirection = true;
            }
        }

        function hasGameEnded() {
            const head = snake[0];
            
            // Wall collisions
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitToptWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) return true;

            // Self collisions
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            document.getElementById("score").innerText = score;
            generateFood();
        }
    </script>
</body>
</html>
